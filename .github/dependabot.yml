# Minimum-viable Dependabot config. Weekly cadence, both ecosystems.
# Version pins in pnpm.overrides are deliberate (see handoff "Tech Stack");
# close PRs that conflict with the pin policy. Add `ignore` blocks here once
# noise patterns emerge.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # ioredis 5.10 → 5.11 (or any later bump) produces cross-version type
      # conflicts in the workspace lockfile: bullmq's ConnectionOptions
      # type resolves to ioredis@5.10.x via a transitive path while a
      # direct dependency in packages/queue + apps/drainer + apps/scheduler
      # resolves to ioredis@5.11.x. CI build fails with TS2322 errors
      # across 6 files when both versions coexist.
      #
      # Re-evaluate as a dedicated PR in a future session: either pin
      # bullmq + ioredis together, override ioredis to a single version
      # workspace-wide, or wait for bullmq to update its ioredis pin.
      - dependency-name: "ioredis"
      # React + react-dom + @types/react/-dom — DO NOT bump independently.
      # React 19 requires Polaris 14 + Remix 3 (or Remix 2.20+ once it
      # widens peerDeps). Polaris 13.9.5 + Remix 2.17.4 both pin
      # react: ^18.0.0 in their peerDeps; bumping React alone crashes
      # react-dom@18 at module load (TypeError: Cannot read properties
      # of undefined (reading 'ReactCurrentDispatcher')) because React
      # 19 removed the private internals react-dom@18 reads.
      #
      # Re-evaluate as a dedicated coupled-upgrade session (per
      # POINTS-TO-CONSIDER.md item 11.10's Polaris audit).
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      # @shopify/* app family — DO NOT bump independently. The 4 packages
      # below form a coupling unit; their majors move together AND they
      # transitively require the React/Polaris/Remix/Prisma chain to
      # upgrade in lockstep.
      #
      # Coupling map (verified 2026-06-01):
      #   - @shopify/shopify-app-remix 4.x is the root: direct deps pin
      #     @shopify/shopify-api ^13.0.0 + @shopify/shopify-app-session-
      #     storage ^5.0.0, forcing the three sibling packages.
      #   - shopify-app-remix 4.x transitively requires React 19 via
      #     @remix-run/react@2.17.4+ (peerDep react ^18.0.0 today; the
      #     react/-dom/@types/react/-dom entries above share this gate).
      #   - React 19 requires Polaris 14 (POINTS-TO-CONSIDER 11.10).
      #   - shopify-app-session-storage-prisma 9.x additionally pins
      #     @prisma/client + prisma ^6.19.0 — adds Prisma 5 → 6 to chain.
      #
      # Full coupled set (move together or not at all):
      #   shopify-api, shopify-app-remix, shopify-app-session-storage,
      #   shopify-app-session-storage-prisma, react, react-dom,
      #   @types/react, @types/react-dom, @shopify/polaris,
      #   @remix-run/react family, prisma, @prisma/client.
      #
      # Re-evaluate as a dedicated coupled-upgrade session.
      - dependency-name: "@shopify/shopify-api"
      - dependency-name: "@shopify/shopify-app-remix"
      - dependency-name: "@shopify/shopify-app-session-storage"
      - dependency-name: "@shopify/shopify-app-session-storage-prisma"
      # vitest — DO NOT bump independently.
      #
      # Audit findings (Phase 1 of M11.x sweep, 2026-06-01):
      #   - Migration 2 → 4 is mechanically small: 4 integration
      #     configs need poolOptions.forks.singleFork → maxWorkers +
      #     isolate transition (~12 lines net).
      #   - Our vi.restoreAllMocks/vi.hoisted/vi.mock patterns are
      #     already v4-compatible (40+ test files unaffected by the
      #     documented semantic shifts).
      #   - No external coupled-upgrade (vitest 4 stands alone).
      #
      # Reason for deferral: vitest IS the verification surface for
      # the remaining override-sweep work (zod #8, prisma #9).
      # Migrating it mid-sweep would compromise our ability to verify
      # those bumps. The vitest 4 migration deserves a dedicated
      # session AFTER the sweep completes.
      #
      # Unfreeze condition: dedicated half-day session with full
      # empirical verification matrix (all 4 integration suites +
      # workspace unit + per-call-site vi.restoreAllMocks audit).
      - dependency-name: "vitest"
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
