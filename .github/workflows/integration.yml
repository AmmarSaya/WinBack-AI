name: Integration tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: winback
          POSTGRES_PASSWORD: winback
          POSTGRES_DB: winback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://winback:winback@localhost:5432/winback_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Run Prisma migrations
        run: pnpm --filter @winback/db exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://winback:winback@localhost:5432/winback_test

      - name: Run integration tests
        run: pnpm --filter @winback/db exec vitest run --config vitest.integration.config.ts
        env:
          DATABASE_URL: postgresql://winback:winback@localhost:5432/winback_test
