name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: winback
          POSTGRES_PASSWORD: winback
          POSTGRES_DB: winback_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U winback -d winback_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://winback:winback@localhost:5433/winback_test
      REDIS_URL: redis://localhost:6380
      NODE_ENV: test
      LOG_LEVEL: error
      SERVICE_NAME: ci
      SHOPIFY_API_KEY: ci-test-api-key
      SHOPIFY_API_SECRET: ci-test-api-secret
      SHOPIFY_APP_URL: https://ci.test.invalid
      SHOPIFY_SCOPES: read_customers,read_orders,read_products,read_inventory,read_price_rules,read_discounts,write_discounts,write_marketing_events,read_marketing_events
      SHOPIFY_API_VERSION: 2026-04
      # 32-byte base64 placeholder — NOT a real secret; no production data
      # is encrypted in CI.  Real key lives in deployed env only.
      ENCRYPTION_KEY: dGVzdGtleTAxMjM0NTY3ODlhYmNkZWZnaGlqa2xtbm9wcXJzdHU=
      # AI provider config — placeholder values for boot validation.
      # No real LLM calls in CI; all providers mocked in unit + integration tests.
      AI_PROVIDER: deepseek
      AI_MODEL: deepseek-v4-flash
      AI_MAX_TOKENS: 300
      AI_TEMPERATURE: 0.7
      DEEPSEEK_API_KEY: ci-test-deepseek-key-not-real

    steps:
      - uses: actions/checkout@v7

      # Fail-fastest: catches drifted pnpm.overrides BEFORE the ~60s install
      # and ~90s build burn. Pure Node — uses the runner's pre-installed
      # Node 20.x; no setup-node / pnpm required for this step.
      # See scripts/check-override-alignment.mjs header + POINTS-TO-CONSIDER.md M11.x.
      - name: Check pnpm.overrides alignment
        run: node ./scripts/check-override-alignment.mjs

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Run unit tests
        run: pnpm -r test -- --reporter=verbose

      - name: Apply Prisma migrations to test DB
        run: pnpm --filter @winback/db exec prisma migrate deploy

      - name: Run db integration tests
        run: pnpm db:test:run

      - name: Run web integration tests
        run: pnpm web:test:run

      - name: Run drainer integration tests
        run: pnpm drainer:test:run

      - name: Run queue integration tests
        run: pnpm queue:test:run
