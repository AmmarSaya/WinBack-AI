client_id = "ff21fc702dbae7c96a9d1122017feb02"
application_url = "https://winback-ai-web.onrender.com"
embedded = true
name = "Winback AI"

[webhooks]
api_version = "2026-04"

[webhooks.privacy_compliance]
customer_data_request_url = "https://winback-ai-web.onrender.com/webhooks"
customer_deletion_url = "https://winback-ai-web.onrender.com/webhooks"
shop_deletion_url = "https://winback-ai-web.onrender.com/webhooks"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_orders,read_products,read_inventory,read_price_rules,read_discounts,write_discounts,write_marketing_events,read_marketing_events"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
# Token Exchange (M-8) does not use the OAuth redirect URI mechanism —
# Shopify never actually redirects TO any URL in this list. The block is
# still required by the Shopify CLI's toml schema validation (the deploy
# command rejects a toml missing the [auth] table). The pre-B4 value
# pointed at /auth/callback (the legacy code-grant completer, now
# deleted). Replaced with /auth (the Token Exchange bootstrap entry —
# real route, returns 400 if hit without id_token) so the placeholder
# at least points at code that exists.
redirect_urls = [ "https://winback-ai-web.onrender.com/auth" ]
